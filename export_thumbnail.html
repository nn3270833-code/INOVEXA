<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MediInfo YouTube Thumbnail</title>
<style>
  body {
    margin: 0;
    padding: 2rem;
    background: #061b29;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 90vh;
  }
  h1 { margin-bottom: 0.3rem; font-size: 2rem; }
  p { color: #94a3b8; margin-bottom: 1.5rem; font-size: 1.1rem; }
  .preview-box {
    max-width: 960px;
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 0 3px #14b8a6;
    margin-bottom: 1.5rem;
    background: #04131d;
  }
  img, canvas {
    width: 100%;
    height: auto;
    display: block;
  }
  .btn-row {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    background: linear-gradient(135deg, #10b981, #0f766e);
    color: #fff;
    border: 0;
    padding: 1rem 2.2rem;
    font-size: 1.2rem;
    font-weight: 700;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
    transition: transform 0.15s, opacity 0.15s;
  }
  button:hover { transform: translateY(-2px); opacity: 0.95; }
  .status {
    margin-top: 1rem;
    font-size: 1rem;
    color: #2dd4bf;
    font-weight: 600;
  }
</style>
</head>
<body>

<h1>🎬 MediInfo YouTube Thumbnail (1280x720)</h1>
<p>Official 16:9 Full HD Thumbnail for your YouTube video.</p>

<div class="preview-box">
  <canvas id="thumbCanvas" width="1280" height="720"></canvas>
</div>

<div class="btn-row">
  <button id="dlBtn">⬇ Download thumbnail.png</button>
</div>
<div class="status" id="statusMsg">Rendering high-resolution thumbnail...</div>

<script>
const canvas = document.getElementById('thumbCanvas');
const ctx = canvas.getContext('2d');
const img = new Image();

img.onload = () => {
  ctx.drawImage(img, 0, 0, 1280, 720);
  document.getElementById('statusMsg').textContent = '✅ High-resolution 1280x720 thumbnail rendered and ready!';
};
img.src = 'thumbnail.svg';

function downloadThumbnail() {
  const a = document.createElement('a');
  a.download = 'thumbnail.png';
  a.href = canvas.toDataURL('image/png');
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

document.getElementById('dlBtn').onclick = downloadThumbnail;
</script>
</body>
</html>
