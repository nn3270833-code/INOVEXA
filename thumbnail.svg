<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#061b29;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04131d"/>
      <stop offset="40%" stop-color="#072b38"/>
      <stop offset="80%" stop-color="#0b4845"/>
      <stop offset="100%" stop-color="#0d5c56"/>
    </linearGradient>

    <!-- Glowing Radial for Center -->
    <radialGradient id="glowTeal" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#0f766e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#061b29" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowAmber" cx="25%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#04131d" stop-opacity="0"/>
    </radialGradient>

    <!-- Pill Gradient 1 -->
    <linearGradient id="capsuleTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="capsuleWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Gold Badge Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <rect width="1280" height="720" fill="url(#glowTeal)"/>
  <rect width="1280" height="720" fill="url(#glowAmber)"/>

  <!-- Subtle Medical Grid Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
  </g>

  <!-- Floating Ambient Particles -->
  <circle cx="180" cy="140" r="4" fill="#2dd4bf" opacity="0.6" filter="url(#glow)"/>
  <circle cx="280" cy="80" r="6" fill="#fbbf24" opacity="0.7" filter="url(#glow)"/>
  <circle cx="680" cy="110" r="5" fill="#2dd4bf" opacity="0.5"/>
  <circle cx="1180" cy="220" r="7" fill="#14b8a6" opacity="0.8" filter="url(#glow)"/>
  <circle cx="1120" cy="580" r="5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="620" cy="640" r="6" fill="#2dd4bf" opacity="0.5"/>

  <!-- ================= LEFT COLUMN: TITLE & HIGHLIGHTS ================= -->
  
  <!-- Hackathon Tag -->
  <g transform="translate(90, 75)">
    <rect width="250" height="42" rx="21" fill="url(#goldGrad)" filter="url(#shadow)"/>
    <text x="125" y="27" font-size="19" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1.5">🏆 HACKATHON 2026</text>
  </g>

  <!-- Main App Title -->
  <g transform="translate(90, 205)">
    <!-- Main Logo Icon Pill -->
    <text x="0" y="0" font-size="78" font-weight="900" fill="#ffffff" filter="url(#shadow)" letter-spacing="-1">
      💊 Medi<tspan fill="#2dd4bf">Info</tspan>
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(95, 275)">
    <text x="0" y="0" font-size="34" font-weight="700" fill="#e2e8f0" filter="url(#shadow)">
      AI Medicine &amp; Patient Safety Portal
    </text>
  </g>

  <!-- Feature Pills Badges -->
  <g transform="translate(90, 335)">
    <!-- Badge 1: Price Savings -->
    <rect x="0" y="0" width="470" height="60" rx="14" fill="#0f2938" stroke="#14b8a6" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="24" y="38" font-size="24" font-weight="800" fill="#fbbf24">💰 Save 30%–70%</text>
    <text x="220" y="38" font-size="22" font-weight="600" fill="#f1f5f9">on Generic Brands</text>

    <!-- Badge 2: Hindsight AI -->
    <rect x="0" y="78" width="470" height="60" rx="14" fill="#0f2938" stroke="#f59e0b" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="24" y="116" font-size="24" font-weight="800" fill="#f59e0b">⏪ Hindsight AI</text>
    <text x="195" y="116" font-size="22" font-weight="600" fill="#f1f5f9">Safety &amp; Overdose Radar</text>

    <!-- Badge 3: 18 Languages -->
    <rect x="0" y="156" width="470" height="60" rx="14" fill="#0f2938" stroke="#2dd4bf" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="24" y="194" font-size="24" font-weight="800" fill="#2dd4bf">🌐 18 Indian Languages</text>
    <text x="310" y="194" font-size="22" font-weight="600" fill="#f1f5f9">+ Voice AI</text>
  </g>

  <!-- Footer Team Credit -->
  <g transform="translate(95, 630)">
    <rect x="0" y="0" width="310" height="42" rx="10" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)"/>
    <text x="20" y="27" font-size="18" font-weight="700" fill="#94a3b8">
      Built by <tspan fill="#38bdf8" font-weight="800">Team INOVEXA</tspan>
    </text>
  </g>

  <!-- ================= RIGHT COLUMN: 3D ARTWORK & MASCOT ================= -->

  <!-- Glowing Backdrop Circle for Artwork -->
  <circle cx="950" cy="360" r="260" fill="url(#glowTeal)" opacity="0.8"/>
  <circle cx="950" cy="360" r="200" fill="#093645" opacity="0.4" stroke="#14b8a6" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Giant Floating 3D Capsule (Rotated 35 deg) -->
  <g transform="translate(970, 240) rotate(-28)" filter="url(#shadow)">
    <!-- Capsule Left (Teal) -->
    <path d="M-130,-55 L0,-55 A55,55 0 0,1 0,55 L-130,55 A55,55 0 0,1 -130,-55 Z" fill="url(#capsuleTeal)" stroke="#5eead4" stroke-width="3"/>
    <!-- Capsule Right (White) -->
    <path d="M0,-55 L130,-55 A55,55 0 0,1 130,55 L0,55 A55,55 0 0,1 0,-55 Z" fill="url(#capsuleWhite)" stroke="#ffffff" stroke-width="3"/>
    <!-- Glossy Highlight Streak -->
    <path d="M-110,-32 L110,-32" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.5"/>
    <path d="M-90,-16 L60,-16" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
    <!-- Center Dividing Band -->
    <line x1="0" y1="-55" x2="0" y2="55" stroke="rgba(15, 23, 42, 0.35)" stroke-width="4"/>
  </g>

  <!-- Floating Round Tablet / Pill -->
  <g transform="translate(740, 480) rotate(15)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="80" ry="46" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <ellipse cx="0" cy="-6" rx="72" ry="38" fill="#ffffff"/>
    <line x1="-55" y1="-6" x2="55" y2="-6" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Large Floating Glass Card: Price Comparison Demo -->
  <g transform="translate(730, 85)" filter="url(#shadow)">
    <rect width="460" height="135" rx="18" fill="#0d2e3d" stroke="#2dd4bf" stroke-width="2.5" opacity="0.95"/>
    <text x="24" y="38" font-size="18" font-weight="700" fill="#94a3b8">SMART GENERIC COMPARISON</text>
    <text x="24" y="74" font-size="28" font-weight="900" fill="#ffffff">Augmentin 625: ₹196</text>
    <text x="24" y="112" font-size="26" font-weight="900" fill="#10b981">Generic Brand: ₹58 (Save 70%)</text>
    <rect x="340" y="32" width="96" height="72" rx="14" fill="#10b981" opacity="0.2"/>
    <text x="388" y="76" font-size="34" font-weight="900" fill="#10b981" text-anchor="middle">✓</text>
  </g>

  <!-- Friendly Robot Mascot: MediBot -->
  <g transform="translate(1010, 440)" filter="url(#shadow)">
    <!-- Robot Head Outline / Shadow -->
    <rect x="-80" y="-80" width="160" height="140" rx="42" fill="#0f766e" stroke="#5eead4" stroke-width="5"/>
    <!-- Antenna -->
    <line x1="0" y1="-80" x2="0" y2="-120" stroke="#0f766e" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="-125" r="16" fill="#f59e0b" filter="url(#glow)"/>
    <circle cx="0" cy="-125" r="8" fill="#fef3c7"/>
    <!-- Screen Face -->
    <rect x="-62" y="-58" width="124" height="96" rx="28" fill="#e6f7f5"/>
    <!-- Cute Eyes -->
    <circle cx="-30" cy="-15" r="15" fill="#0f172a"/>
    <circle cx="30" cy="-15" r="15" fill="#0f172a"/>
    <!-- Eye Highlights -->
    <circle cx="-25" cy="-20" r="5" fill="#ffffff"/>
    <circle cx="35" cy="-20" r="5" fill="#ffffff"/>
    <!-- Smile -->
    <path d="M-22,14 Q0,32 22,14" fill="none" stroke="#0f766e" stroke-width="6" stroke-linecap="round"/>
    <!-- Cheeks (Blush) -->
    <circle cx="-45" cy="8" r="8" fill="#f87171" opacity="0.5"/>
    <circle cx="45" cy="8" r="8" fill="#f87171" opacity="0.5"/>
    <!-- Ears / Head Bolts -->
    <circle cx="-85" cy="-10" r="12" fill="#0d9488"/>
    <circle cx="85" cy="-10" r="12" fill="#0d9488"/>
    <!-- Collar / Body Peek -->
    <rect x="-45" y="60" width="90" height="35" rx="12" fill="#0d9488" stroke="#5eead4" stroke-width="3"/>
    <text x="0" y="84" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">AI BOT</text>
  </g>

  <!-- Bottom Right Badge: 100% Free & Open Source -->
  <g transform="translate(1010, 640)">
    <rect x="-120" y="0" width="240" height="42" rx="21" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="27" font-size="17" font-weight="800" fill="#10b981" text-anchor="middle">⚡ 100% OPEN SOURCE</text>
  </g>
</svg>
